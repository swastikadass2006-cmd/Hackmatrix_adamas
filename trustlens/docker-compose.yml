version: '3.8'

services:
  # 1. Rust Security Engine
  rust_security:
    build: ./engines/security_engine
    ports:
    - "8001:8001"
    environment:
    - DISTRUSTED_CA_PATTERNS=emudhra,symantec,wosign,startcom
    restart: unless-stopped
    networks:
    - trustlens-net

  # 2. FastAPI Gateway & AI Engine
  api_gateway:
    build: ./gateway  # Replace with your actual gateway build context if applicable
    ports:
    - "8000:8000"
    volumes:
    - ./gateway:/app
    environment:
    - DATABASE_URL=postgresql://trustlens:hackathon2026@postgres:5432/trustlensdb
    - REDIS_URL=redis://redis:6379/0
    - SECURITY_ENGINE_URL=http://rust_security:8001/api/v1/security/analyze
    - RENDER_ML_URL=https://hackmatrix-adamas.onrender.com/predict
    depends_on:
    - rust_security
    - postgres
    - redis
    restart: unless-stopped
    networks:
    - trustlens-net

  # 3. Next.js Frontend
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
    - "3000:3000"
    volumes:
    - ./frontend:/app
    - /app/node_modules
    - /app/.next
    environment:
    - NEXT_PUBLIC_API_URL=http://localhost:8000
    - NODE_ENV=development
    depends_on:
    - api_gateway
    networks:
    - trustlens-net

  # 4. PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    environment:
    - POSTGRES_USER=trustlens
    - POSTGRES_PASSWORD=hackathon2026
    - POSTGRES_DB=trustlensdb
    ports:
    - "5432:5432"
    volumes:
    - pgdata:/var/lib/postgresql/data
    networks:
    - trustlens-net

  # 5. Redis Cache
  redis:
    image: redis:7-alpine
    ports:
    - "6379:6379"
    networks:
    - trustlens-net

  # 6. Telegram Community Cyber-Threat Bot
  telegram_bot:
    build: ./bot
    environment:
    - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN:-}
    - GATEWAY_URL=http://api_gateway:8000
    - FRONTEND_URL=https://hackmatrixadamas.vercel.app
    depends_on:
    - api_gateway
    restart: unless-stopped
    networks:
    - trustlens-net

networks:
  trustlens-net:
    driver: bridge

volumes:
  pgdata:
