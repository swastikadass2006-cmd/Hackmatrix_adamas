version: '3.8'

services:
  # Fast-API Gateway & In-Process Phishing Engine
  api_gateway:
    build: ./gateway
    ports:
      - "8000:8000"
    environment:
      - SECURITY_ENGINE_URL=http://rust_security:8001
    depends_on:
      - rust_security

  # Rust Security & X.509 Cryptographic Engine
  rust_security:
    build: ./engines/security_engine
    ports:
      - "8001:8001"
    environment:
      - DISTRUSTED_CA_PATTERNS=emudhra,symantec,wosign,startcom

  # Next.js Digital Trust Dashboard
  frontend:
    image: node:18-alpine
    working_dir: /app
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "3000:3000"
    command: sh -c "npm install && npm run dev"
    depends_on:
      - api_gateway
