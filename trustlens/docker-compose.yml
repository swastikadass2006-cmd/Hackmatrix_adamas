version: '3.8'

services:
  # FastAPI Gateway & API Router
  api_gateway:
    build:
      context: ./gateway
      dockerfile: Dockerfile
    ports:
    - "8000:8000"
    environment:
    # If Rust runs in Docker container:
    - SECURITY_ENGINE_URL=http://rust_security:8001/api/v1/security/analyze
    # If Rust runs natively on Linux Mint host:
    # - SECURITY_ENGINE_URL=http://host.docker.internal:8001/api/v1/security/analyze
    - COLAB_ML_URL=https://nursery-battle-identify-assign.trycloudflare.com/api/v1/ml/analyze
    extra_hosts:
    - "host.docker.internal:host-gateway"
    depends_on:
    - rust_security
    restart: unless-stopped

  # Rust Security Engine (Member 2)
  rust_security:
    build: ./engines/security_engine
    ports:
    - "8001:8001"
    environment:
    - DISTRUSTED_CA_PATTERNS=emudhra,symantec,wosign,startcom
    restart: unless-stopped

  # Next.js Dashboard (Member 4)
  frontend:
    image: node:18-alpine
    working_dir: /app
    volumes:
    - ./frontend:/app
    - /app/node_modules
    ports:
    - "3000:3000"
    command: sh -c "npm install && npm run dev"
    depends_on:
    - api_gateway
