<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <style>
    body {
      margin: 0;
      width: 320px;
      background: #09090b;
      color: #fafafa;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      padding: 16px;
      box-sizing: border-box;
    }
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid #27272a;
      padding-bottom: 10px;
      margin-bottom: 12px;
    }
    .brand {
      font-weight: bold;
      font-size: 14px;
      color: #10b981;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .score-box {
      background: #18181b;
      border: 1px solid #27272a;
      border-radius: 8px;
      padding: 12px;
      text-align: center;
      margin-bottom: 12px;
    }
    .score-num {
      font-size: 32px;
      font-weight: 800;
      font-family: monospace;
    }
    .score-safe { color: #10b981; }
    .score-suspicious { color: #f59e0b; }
    .score-malicious { color: #ef4444; }
    .verdict-badge {
      display: inline-block;
      font-size: 11px;
      font-weight: bold;
      text-transform: uppercase;
      padding: 2px 8px;
      border-radius: 4px;
      margin-top: 4px;
    }
    .badge-safe { background: rgba(16, 185, 129, 0.2); color: #10b981; border: 1px solid #10b981; }
    .badge-suspicious { background: rgba(245, 158, 11, 0.2); color: #f59e0b; border: 1px solid #f59e0b; }
    .badge-malicious { background: rgba(239, 68, 68, 0.2); color: #ef4444; border: 1px solid #ef4444; }
    .url-text {
      font-size: 11px;
      color: #a1a1aa;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      margin-bottom: 8px;
    }
    button {
      width: 100%;
      background: #10b981;
      color: #09090b;
      border: none;
      border-radius: 6px;
      padding: 8px;
      font-weight: bold;
      font-size: 12px;
      cursor: pointer;
    }
    button:hover { background: #34d399; }
  </style>
</head>
<body>
  <div class="header">
    <div class="brand">🛡️ TrustLens Guard</div>
    <span style="font-size: 10px; color: #71717a; font-family: monospace;">v1.0 MV3</span>
  </div>

  <div class="url-text" id="active-url">Inspecting active tab...</div>

  <div class="score-box" id="result-box">
    <div style="font-size: 10px; color: #71717a; text-transform: uppercase; font-family: monospace;">Digital Trust Score</div>
    <div class="score-num score-safe" id="score-val">--</div>
    <div class="verdict-badge badge-safe" id="verdict-val">READY</div>
  </div>

  <button id="rescan-btn">Audit Current Page</button>

  <script src="popup.js"></script>
</body>
</html>
