# TrustLens Comprehensive Ground-Truth Test Cases
# Schema:
#  - id: Unique test case identifier
#  - category: [suspicious_urls, benign_urls, scam_messages, benign_urgent_messages, tls_fixtures, ssrf_fixtures]
#  - input: target string (URL or message text)
#  - expected_classification: [Confirmed Malicious, High Risk, Suspicious, No indicators found, Inconclusive, Blocked]
#  - expected_risk_min: int (0-100)
#  - expected_risk_max: int (0-100)
#  - expected_signals: list of signal names that must be present in findings

